aid: octane-lending
name: Octane Lending
description: 'Octane (Octane Lending, Inc.) is a New York City fintech founded in 2014 that makes
  powersports, outdoor power equipment and recreational-vehicle financing as simple as paying cash.
  It runs an end-to-end digital lending platform — instant soft-pull prequalification for consumers,
  real-time credit decisioning and eContracting through its in-house lender Roadrunner Financial,
  Inc., and loan servicing — connecting more than 4,000 dealer partners and 30-plus OEMs with prime
  through non-prime buyers. Its Dealer Portal 2.0 and dealer-management-system integrations (AppOne,
  Ekho and similar DMS platforms) submit credit applications and return decisions over a partner API
  whose credentials are coordinated privately by Octane account managers; Octane publishes no public
  developer portal, API documentation or machine-readable specification.'
